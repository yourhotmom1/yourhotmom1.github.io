<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain nicht abzugeben</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; font-size: 24px; color: #111827; }
        p { font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 10px; }
        .date-info {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 30px;
            font-style: italic;
        }
        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
            color: #6b7280;
        }
        .footer-note a {
            color: #374151;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Domain steht nicht zum Verkauf</h1>
        <p>Bitte sehen Sie von Anfragen ab. Diese Domain wird weder verkauft noch anderweitig abgegeben. Daran wird sich auch in Zukunft nichts ändern.</p>
        
        <div class="date-info">
            Stand der Information: <span id="dynamic-date"></span>
        </div>

        <div class="footer-note">
            Willst es trotzdem versuchen? Schreib mir ne Mail: <br>
            <a href="mailto:netterversuch@brugger.de">netterversuch@brugger.de</a>
        </div>
    </div>

    <script>
        // Heutiges Datum holen und 7 Tage abziehen
        const d = new Date();
        d.setDate(d.getDate() - 7);
        
        // Datum ins deutsche Format umwandeln (TT.MM.JJJJ)
        const dateString = d.toLocaleDateString('de-DE');
        
        // Das berechnete Datum in das HTML-Element einfügen
        document.getElementById('dynamic-date').innerText = dateString;
    </script>
</body>
</html>
