<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain nicht abzugeben</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; 
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        h1 { margin-top: 0; font-size: 24px; color: #111827; }
        p { font-size: 16px; line-height: 1.6; color: #4b5563; margin-bottom: 10px; }
        .date-info {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
            font-style: italic;
        }
        
        #troll-btn {
            background-color: #10b981; 
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.4);
            transition: background-color 0.2s;
            margin-bottom: 30px;
            position: relative; 
            z-index: 9999;
        }

        /* Hier ist die geänderte, winzige Fußzeile */
        .footer-note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 10px; /* Sehr klein */
            color: #9ca3af; /* Helles Grau zur Tarnung */
        }
        .footer-note a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: normal; /* Nicht mehr fettgedruckt */
        }
        .footer-note a:hover {
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Domain steht nicht zum Verkauf</h1>
        <p>Bitte sehen Sie von Anfragen ab. Diese Domain wird weder verkauft noch anderweitig abgegeben. Daran wird sich auch in Zukunft nichts ändern.</p>
        
        <div class="date-info">
            Stand der Information: <span id="dynamic-date"></span>
        </div>

        <button id="troll-btn">Angebot abgeben 💰</button>

        <div class="footer-note">
            Willst es trotzdem versuchen? Schreib mir ne Mail: <br>
            <a href="mailto:netterversuch@brugger.de">netterversuch@brugger.de</a>
        </div>
    </div>

    <script>
        const d = new Date();
        d.setDate(d.getDate() - 7);
        const dateString = d.toLocaleDateString('de-DE');
        document.getElementById('dynamic-date').innerText = dateString;

        const trollBtn = document.getElementById('troll-btn');
        
        const moveButton = () => {
            trollBtn.style.position = 'fixed';
            
            const maxX = window.innerWidth - trollBtn.clientWidth - 20;
            const maxY = window.innerHeight - trollBtn.clientHeight - 20;
            
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            
            trollBtn.style.left = randomX + 'px';
            trollBtn.style.top = randomY + 'px';
        };

        trollBtn.addEventListener('mouseover', moveButton);
        trollBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });
    </script>
</body>
</html>
