<!DOCTYPE html>
<html lang="de">
<head>

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            width: 100%;

        h1 { margin-top: 0; font-size: 24px; color: #111827; }

<body>
    <div class="card">
        <h1>Domain steht nicht zum Verkauf</h1>
        <p>Bitte sehen Sie von Anfragen ab. Diese Domain wird weder verkauft noch anderweitig abgegeben.<br><br>Daran wird sich auch in Zukunft nichts ändern.</p>
